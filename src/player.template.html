.lesson-body .lesson-sheet-body{font-size:14px;line-height:1.55}
.lesson-body .lesson-sheet-body>section+section{margin-top:18px;padding-top:18px;border-top:1px solid #e0e6e1}
.lesson-body .lesson-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;min-width:0;margin:0;padding:0;border:0}
.lesson-body .lesson-options legend{display:block;width:100%;padding:0 0 10px;margin:0;font-size:13px;font-weight:700;color:var(--lesson-ink)}
.lesson-body .lesson-options label{
  display:flex;align-items:center;gap:9px;min-width:0;min-height:52px;
  padding:10px 11px;border:1px solid var(--lesson-stroke);border-radius:11px;
  background:#fff;color:var(--lesson-ink);font-size:12px;font-weight:600;
  line-height:1.5;cursor:pointer;
}
.lesson-body .lesson-options label:has(input:checked){
  background:#edf5ef;border-color:#8fb9a2;color:var(--lesson-green);
}
.lesson-body .lesson-options input[type="radio"]{
  -webkit-appearance:auto;appearance:auto;
  flex:0 0 18px;box-sizing:border-box;
  width:18px;height:18px;min-width:18px;min-height:18px;
  padding:0;margin:0;border:0;box-shadow:none;
  accent-color:var(--lesson-green);cursor:pointer;
}
.lesson-body .lesson-setting{
  display:flex;align-items:flex-start;flex-direction:row;gap:11px;
  min-width:0;min-height:0;margin:0;padding:0;cursor:pointer;
}
.lesson-body .lesson-setting>input[type="checkbox"]{
  -webkit-appearance:auto;appearance:auto;
  flex:0 0 20px;box-sizing:border-box;
  width:20px;height:20px;min-width:20px;min-height:20px;
  padding:0;margin:2px 0 0;border:0;box-shadow:none;
  accent-color:var(--lesson-green);cursor:pointer;
}
.lesson-body .lesson-setting>span{display:block;flex:1 1 auto;min-width:0}
.lesson-body .lesson-setting strong{display:block;font-size:13px;font-weight:700;line-height:1.5;color:var(--lesson-ink)}
.lesson-body .lesson-setting small{display:block;margin-top:4px;font-size:12px;line-height:1.55;color:var(--lesson-muted);overflow-wrap:anywhere}
.lesson-body .lesson-persistence .lesson-status{margin:9px 0 0 31px;font-size:12px;line-height:1.45;color:var(--lesson-muted)}
.lesson-body .lesson-save label{display:grid;gap:7px;margin:0;font-size:13px;font-weight:650}
.lesson-body .lesson-save input[type="text"]{
  display:block;box-sizing:border-box;width:100%;height:46px;min-height:46px;min-width:0;
  margin:0;padding:9px 12px;border:1px solid #cfd9d1;border-radius:10px;
  background:#fff;color:var(--lesson-ink);font-size:16px;line-height:1.4;
  box-shadow:none;appearance:none;
}
.lesson-body .lesson-save-actions{display:block;margin:12px 0 0}
.lesson-body #lessonSaveEditableButton{
  display:flex;width:100%;min-height:46px;
  background:#eaf4ee;color:var(--lesson-green);border-color:#bcd8c7;
  font-weight:700;
}
.lesson-body #lessonSaveEditableButton:hover:not(:disabled){background:#dcefe3;border-color:#a0c7af}
.lesson-body .lesson-dialog-actions .button{min-width:90px}
.lesson-body .lesson-sheet-header h2{font-size:17px;font-weight:750}
@media(max-width:359px){
  .lesson-body .lesson-options{grid-template-columns:1fr}
  .lesson-body .lesson-options label{min-height:44px}
}
@media(forced-colors:active){
  .lesson-body .lesson-options label:has(input:checked){outline:2px solid Highlight;outline-offset:-2px}
  .lesson-body .button.primary,.lesson-body #lessonSaveEditableButton{border:1px solid ButtonText}
}
</style>
</head>
<body class="lesson-body">
<header class="lesson-header">
  <div class="lesson-header-inner">
    <img class="lesson-icon" src="__APP_ICON_DATA_URI__" alt="" aria-hidden="true">
    <div class="lesson-header-copy">
      <h1 id="lessonTitle">Reveal Sheet lesson</h1>
      <p id="lessonSubtitle">Study sheet</p>
    </div>
    <div class="lesson-header-actions">
      <button id="lessonLanguage" class="lesson-icon-button lesson-language" type="button" aria-label="Switch language">日本語</button>
      <button id="lessonSettingsButton" class="lesson-icon-button lesson-settings-button" type="button" aria-haspopup="dialog" aria-controls="lessonSheet" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.6 2.8h4.8l.6 2.3c.5.2 1 .5 1.5.9l2.3-.7 2.4 4.2-1.8 1.6v1.8l1.8 1.6-2.4 4.2-2.3-.7c-.5.4-1 .7-1.5.9l-.6 2.3H9.6L9 18.9c-.5-.2-1-.5-1.5-.9l-2.3.7-2.4-4.2 1.8-1.6v-1.8L2.8 9.5l2.4-4.2 2.3.7c.5-.4 1-.7 1.5-.9z"/><circle cx="12" cy="12" r="3.1"/></svg>
      </button>
      <button id="lessonHelpButton" class="lesson-icon-button" type="button" aria-label="Help">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.7 9a2.5 2.5 0 1 1 4.2 1.8c-1 .9-1.9 1.2-1.9 2.5M12 17h.01"/></svg>
      </button>
    </div>
  </div>
</header>
<main class="lesson-main">
  <section id="lessonWaiting" class="lesson-waiting" role="status">Preparing lesson…</section>
  <section id="lessonError" class="lesson-error" role="alert" hidden>Could not display this lesson image.</section>
  <section id="lessonReady" hidden>
    <div class="lesson-layout">
      <aside id="lessonPages" class="lesson-pages" aria-label="Pages"></aside>
      <section class="lesson-panel">
        <nav class="lesson-page-switch" id="lessonPageSwitch" aria-label="Page navigation">
          <button class="lesson-page-arrow" id="lessonPrevPage" type="button" aria-label="Previous page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <button class="lesson-page-current" id="lessonPageToggle" type="button" aria-controls="lessonSheet" aria-haspopup="dialog" aria-expanded="false">
            <span id="lessonPageName"></span><small id="lessonPagePosition"></small>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
          </button>
          <button class="lesson-page-arrow" id="lessonNextPage" type="button" aria-label="Next page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </nav>
        <div class="lesson-preview" id="lessonStage"><img id="previewImage" alt="" hidden draggable="false"><svg id="maskSvg" class="mask-layer" hidden aria-label="Covers"></svg>
          <div id="lessonZoomControls" class="lesson-zoom-controls" role="group" aria-label="Image zoom">
            <button id="lessonZoomOut" type="button" aria-label="Zoom out">−</button>
            <button id="lessonZoomFit" type="button" aria-label="Fit image">100%</button>
            <button id="lessonZoomIn" type="button" aria-label="Zoom in">＋</button>
          </div>
        </div>
        <div class="lesson-study">
          <div class="lesson-mode-switch" role="group" aria-label="Study mode"><button class="button" id="lessonFreeMode" type="button" aria-pressed="true"></button><button class="button" id="lessonGuidedMode" type="button" aria-pressed="false"></button></div>
          <p id="lessonPageDescription" class="study-page-description" hidden></p>
          <div id="lessonFreePanel">
            <p class="lesson-summary"><span id="lessonCheckedLabel"></span> <strong id="lessonConfirmedCount">0</strong> / <strong id="lessonQuestionCount">0</strong></p>
            <div class="lesson-actions lesson-free-actions"><button class="button" id="lessonHideAll" type="button"></button><button class="button" id="lessonRevealPage" type="button"></button></div>
            <div id="lessonQuestionList" class="lesson-question-list" aria-label="Questions"></div>
            <div id="lessonFreeAnswerBox" class="lesson-answer" role="region" aria-live="polite" aria-atomic="true" hidden><strong id="lessonFreeAnswerLabel"></strong><p id="lessonFreeAnswer"></p></div>
          </div>
          <div id="lessonGuidedPanel" hidden>
            <fieldset id="lessonOtherOptions" class="lesson-options"><legend id="lessonOtherLegend"></legend><label><input id="lessonOtherHidden" type="radio" name="lessonOther" value="hidden" checked><span id="lessonOtherHiddenText"></span></label><label><input id="lessonOtherVisible" type="radio" name="lessonOther" value="visible"><span id="lessonOtherVisibleText"></span></label></fieldset>
            <div class="lesson-guided-head"><strong id="lessonGuidedProgress" role="status" aria-live="polite">0 / 0</strong><div id="lessonProgressTrack" class="lesson-progress-track" role="progressbar" aria-valuemin="0" aria-valuenow="0" aria-valuemax="1"><span id="lessonProgressFill"></span></div></div>
            <p id="lessonPrompt" class="lesson-prompt" hidden></p>
            <div id="lessonAnswerBox" class="lesson-answer" role="region" aria-live="polite" aria-atomic="true" hidden><p id="lessonAnswer"></p></div>
            <div class="lesson-actions lesson-guided-primary">
              <button class="button primary" id="lessonRevealCurrent" type="button"></button>
              <button class="button primary" id="lessonRecalled" type="button"></button>
              <button class="button" id="lessonAgain" type="button"></button>
            </div>
            <div class="lesson-actions lesson-guided-secondary">
              <button class="button" id="lessonPrevious" type="button"></button>
              <button class="button" id="lessonSkip" type="button"></button>
              <button class="button" id="lessonFinish" type="button"></button>
            </div>
            <div id="lessonGuidedList" class="lesson-question-list" aria-label="Questions"></div>
            <section id="lessonResults" class="lesson-results" hidden>
              <h2 id="lessonResultsTitle"></h2>
              <div class="lesson-result-grid"><span id="lessonTotalLabel"></span><strong id="lessonResultTotal">0</strong><span id="lessonRecalledLabel"></span><strong id="lessonResultRecalled">0</strong><span id="lessonAgainLabel"></span><strong id="lessonResultAgain">0</strong><span id="lessonSkippedLabel"></span><strong id="lessonResultSkipped">0</strong><span id="lessonUnansweredLabel"></span><strong id="lessonResultUnanswered">0</strong></div>
              <div class="lesson-actions lesson-review-actions"><button class="button" id="lessonReviewAgain" type="button"></button><button class="button" id="lessonReviewUnchecked" type="button"></button></div>
            </section>
          </div>
          <div class="lesson-mobile-extras"><button class="button" id="lessonQuestionsButton" type="button" aria-controls="lessonSheet" aria-haspopup="dialog"></button></div>
          <section id="lessonPersistence" class="lesson-persistence"><label class="lesson-setting"><input id="lessonStudyOptIn" type="checkbox"><span><strong id="lessonStudyOptInText"></strong><small id="lessonStudyOptInNote"></small></span></label><p id="lessonStudyStatus" class="lesson-status" role="status" aria-live="polite"></p></section>
          <section id="lessonSave" class="lesson-save"><label><span id="lessonFilenameLabel"></span><input id="lessonFilename" type="text" value="reveal-sheet" autocomplete="off" spellcheck="false"></label><div class="lesson-save-actions"><button class="button lesson-download-button" id="lessonSaveEditableButton" type="button"></button></div></section>
        </div>
      </section>
    </div>
    <footer class="lesson-footer">Reveal Sheet · Browser Kitty · Fully local processing</footer>
  </section>
</main>
<dialog id="lessonSheet" class="lesson-dialog lesson-sheet" aria-labelledby="lessonSheetTitle">
  <div class="lesson-sheet-header"><h2 id="lessonSheetTitle"></h2><button id="lessonSheetClose" class="lesson-icon-button" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"/></svg></button></div>
  <div id="lessonSheetBody" class="lesson-sheet-body"></div>
</dialog>
<dialog id="lessonHelpDialog" class="lesson-dialog" aria-labelledby="lessonHelpTitle"><div class="lesson-dialog-body"><h2 id="lessonHelpTitle"></h2><p id="lessonHelpBody"></p><div class="lesson-dialog-actions"><button class="button" id="lessonHelpClose" type="button"></button></div></div></dialog>
<dialog id="lessonConfirmDialog" class="lesson-dialog" aria-labelledby="lessonConfirmTitle" aria-describedby="lessonConfirmMessage"><div class="lesson-dialog-body"><h2 id="lessonConfirmTitle"></h2><p id="lessonConfirmMessage"></p><div class="lesson-dialog-actions"><button class="button" id="lessonConfirmCancel" type="button"></button><button class="button primary" id="lessonConfirmOk" type="button"></button></div></div></dialog>
<script id="reveal-sheet-data" type="application/json">__REVEAL_LESSON_JSON__</script>
<script>/* REVEAL:PLAYER_RUNTIME */</script>
<noscript><p>This Reveal Sheet lesson requires JavaScript.</p></noscript>
</body>
</html>
