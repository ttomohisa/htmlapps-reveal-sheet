<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f5f5f2">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src 'none'; media-src 'none'; worker-src 'none'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Reveal Sheet</title>
  <link rel="icon" href="__APP_ICON_DATA_URI__">
  <style>
:root { color-scheme:light; --bg:#f5f5f2;--surface:#fff;--surface-muted:#f0f0ed;--surface-hover:#e9e9e5;--text:#20211f;--muted:#666963;--line:#dadbd6;--line-strong:#bfc1ba;--accent:#16624f;--accent-hover:#0e503f;--accent-soft:#e1f0ea;--danger:#b3261e;--focus:#4d8bc7;--shadow-sm:0 1px 2px rgba(25,28,24,.08),0 1px 6px rgba(25,28,24,.04);--shadow-md:0 12px 34px rgba(25,28,24,.10);--header-height:66px; }
* { box-sizing:border-box; }
html { min-height:100%;background:var(--bg); }
body { margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Yu Gothic UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased; }
button,input,textarea { font:inherit;color:inherit; }
button { cursor:pointer; }
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible { outline:3px solid color-mix(in srgb,var(--focus) 55%,transparent);outline-offset:2px; }
.app-header { position:sticky;z-index:30;top:0;min-height:var(--header-height);border-bottom:1px solid color-mix(in srgb,var(--line) 82%,transparent);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px) saturate(1.2); }
.header-inner { width:min(1120px,100%);min-height:var(--header-height);margin:0 auto;padding:10px clamp(14px,2.8vw,30px);display:flex;align-items:center;gap:14px; }
.brand { display:flex;align-items:center;gap:10px;min-width:0; }
.brand-mark { width:38px;height:38px;flex:0 0 auto;border-radius:11px;overflow:hidden;box-shadow:var(--shadow-sm); }
.brand-mark img { width:100%;height:100%;display:block; }
.brand-copy { min-width:0; }
.brand-name { margin:0;display:flex;align-items:center;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
#brandName { overflow:hidden;text-overflow:ellipsis; }
.version-badge { display:inline-flex;margin-left:7px;padding:1px 6px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:var(--surface-muted);font-size:10px;font-weight:700;vertical-align:2px; }
.brand-meta { margin:2px 0 0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.header-actions { margin-left:auto;display:flex;align-items:center;gap:12px; }
.language-button { padding:6px 1px;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:750;cursor:pointer; }
.language-button:hover { color:var(--text); }
.icon-button { display:inline-grid;place-items:center;width:38px;height:38px;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer; }
.icon-button:hover { border-color:var(--line-strong);background:var(--surface-hover); }
.header-icon-button { width:auto;height:auto;padding:6px 1px;border:0;border-radius:0;background:transparent;color:var(--muted); }
.header-icon-button:hover { background:transparent;color:var(--text); }
.header-icon-button svg { width:20px;height:20px; }
.main { width:min(1120px,100%);margin:0 auto;padding:24px clamp(14px,2.8vw,30px) 56px; }
.page-intro { display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding:0 2px 20px; }
.page-intro h1 { margin:0;font-size:clamp(22px,3vw,28px);line-height:1.3;letter-spacing:-.025em; }
.page-intro p { max-width:720px;margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.5; }
.local-badge { display:inline-flex;align-items:center;gap:7px;flex:0 0 auto;margin-top:3px;padding:7px 10px;border:1px solid color-mix(in srgb,var(--accent) 24%,var(--line));border-radius:999px;color:var(--accent);background:var(--accent-soft);font-size:12px;font-weight:700;white-space:nowrap; }
.local-badge svg { width:15px;height:15px; }
.button { border:1px solid var(--line);border-radius:11px;padding:10px 16px;background:var(--surface);font-size:14px;font-weight:600; }
.button:hover { background:var(--surface-hover); }
.button.primary { background:var(--accent);color:white;border-color:var(--accent); }
.button.primary:hover { background:var(--accent-hover); }
.reveal-shell { background:white;border:1px solid var(--line);border-radius:18px; }
.export-field { display:flex;flex-direction:column;gap:8px;max-width:480px; }
.export-label { font-size:13px; }
.filename-control { display:flex;align-items:center;gap:8px; }
.filename-input { flex:1;border:1px solid var(--line);border-radius:8px;padding:12px; }
.filename-extension { font-size:12px; }
footer { padding:32px 16px;text-align:center;font-size:12px;color:var(--muted); }
.sr-only { position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0; }
dialog { color:var(--text);background:var(--surface); }
#helpDialog { width:min(640px,calc(100vw - 24px));max-width:100%;max-height:calc(100dvh - 24px);padding:0;border:1px solid var(--line);border-radius:18px;overflow:hidden; }
#helpDialog[open] { display:flex;flex-direction:column; }
#helpDialog::backdrop { background:#0f110e7a; }
.dialog-header { display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);flex-shrink:0; }
.dialog-header h2 { margin:0;font-size:18px; }
.dialog-body { overflow:auto;overscroll-behavior:contain;padding:18px 22px calc(22px + env(safe-area-inset-bottom));font-size:14px;line-height:1.9; }
.dialog-body h3 { font-size:16px;margin:18px 0 8px; }
.dialog-body h3:first-child { margin-top:0; }
.dialog-body li { margin-bottom:10px; }
.dialog-note { background:#edf4f0;padding:14px;border-radius:10px; }
@media(max-width:479px) { .version-badge { display:none; } }
/* Adapt canonical confirmation to short viewports without losing its bottom sheet. */
.app-confirm-dialog { max-height:calc(100dvh - 16px); }
.app-confirm-dialog[open] { display:flex;flex-direction:column; }
.app-confirm-header { flex-shrink:0; }
.app-confirm-body { overflow:auto;overscroll-behavior:contain; }

/* Canonical confirmation component from components/confirm-dialog.html. */
.app-confirm-dialog { width:min(420px,calc(100% - 24px));max-width:100%;padding:0;overflow:hidden;border:1px solid var(--line,#dadbd6);border-radius:17px;background:var(--surface,#fff);color:var(--text,#20211f);box-shadow:var(--shadow-md,0 12px 34px rgba(25,28,24,.10)); }
.app-confirm-dialog::backdrop { background:rgba(15,17,14,.48);backdrop-filter:blur(3px); }
.app-confirm-header { display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px 13px;border-bottom:1px solid var(--line,#dadbd6); }
.app-confirm-title { margin:0;font-size:17px;letter-spacing:-.01em; }
.app-confirm-close { display:grid;place-items:center;width:36px;height:36px;padding:0;border:0;border-radius:10px;background:transparent;color:var(--text,#20211f);cursor:pointer; }
.app-confirm-close:hover { background:var(--surface-hover,#e9e9e5); }
.app-confirm-close svg { width:19px;height:19px; }
.app-confirm-body { padding:18px; }
.app-confirm-message { margin:0;color:var(--muted,#666963);font-size:13px;line-height:1.7;overflow-wrap:anywhere; }
.app-confirm-actions { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:18px; }
.app-confirm-button { display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 12px;border:1px solid var(--line,#dadbd6);border-radius:11px;background:var(--surface,#fff);color:var(--text,#20211f);font:inherit;font-size:12px;font-weight:760;cursor:pointer; }
.app-confirm-button:hover { border-color:var(--line-strong,#bfc1ba);background:var(--surface-hover,#e9e9e5); }
.app-confirm-button.primary { border-color:var(--accent,#16624f);background:var(--accent,#16624f);color:#fff; }
.app-confirm-button.primary:hover { border-color:var(--accent-hover,#0e503f);background:var(--accent-hover,#0e503f); }
.app-confirm-button.danger { border-color:var(--danger,#b3261e);background:var(--danger,#b3261e);color:#fff; }
.app-confirm-button:focus-visible,.app-confirm-close:focus-visible { outline:3px solid color-mix(in srgb,var(--focus,#4d8bc7) 55%,transparent);outline-offset:2px; }
@media(max-width:520px) {
 .app-confirm-dialog { width:100%;max-width:none;margin:auto 0 0;border-width:1px 0 0;border-radius:22px 22px 0 0; }
 .app-confirm-dialog::backdrop { background:rgba(0,0,0,.42);backdrop-filter:blur(2px); }
 .app-confirm-header { padding:14px 18px 12px; }
 .app-confirm-body { padding:12px 18px calc(env(safe-area-inset-bottom) + 18px); }
 .app-confirm-message { font-size:14px;line-height:1.75; }
 .app-confirm-actions { grid-template-columns:1fr;gap:10px;margin-top:16px; }
 .app-confirm-button { min-height:48px;font-size:14px; }
}
@media(prefers-reduced-motion:reduce) { .app-confirm-dialog,.app-confirm-button,.app-confirm-close { transition:none!important; } }
/* Canonical toast / Undo component from components/toast.html. */
.app-toast { position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:60;display:flex;align-items:center;gap:12px;max-width:min(420px,calc(100vw - 36px));padding:10px 12px 10px 14px;border:1px solid var(--line,#dadbd6);border-radius:12px;background:var(--surface,#fff);color:var(--text,#20211f);box-shadow:var(--shadow-md,0 12px 34px rgba(25,28,24,.10));opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .18s ease,transform .18s ease; }
.app-toast.show { opacity:1;transform:translateY(0);pointer-events:auto; }
.app-toast[data-tone="success"] { border-color:color-mix(in srgb,var(--accent,#16624f) 34%,var(--line,#dadbd6)); }
.app-toast[data-tone="warning"] { border-color:#c58a24; }
.app-toast-message { min-width:0;flex:1 1 auto;font-size:13px;line-height:1.45;overflow-wrap:anywhere; }
.app-toast-action { flex:0 0 auto;min-height:34px;padding:5px 8px;border:0;border-radius:8px;background:transparent;color:var(--accent,#16624f);font:inherit;font-size:12px;font-weight:800;cursor:pointer; }
.app-toast-action:hover { background:var(--surface-hover,#e9e9e5); }
.app-toast-action[hidden] { display:none; }
@media(max-width:520px) { .app-toast { left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:none; } }
/* REVEAL:SHARED_CSS */
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><img id="appBrandIcon" src="__APP_ICON_DATA_URI__" alt=""></div>
        <div class="brand-copy">
          <p class="brand-name"><span id="brandName">Reveal Sheet</span><span class="version-badge" id="versionBadge">v0.1.0</span></p>
          <p class="brand-meta" data-i18n="brandMeta">Study sheets from your images</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="language-button" id="languageButton" type="button" aria-label="Switch language">EN</button>
        <button class="icon-button header-icon-button" id="helpButton" type="button" data-i18n-title="helpTitle" data-i18n-aria-label="helpTitle" title="使い方と注意事項" aria-label="使い方と注意事項"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.35 2.35 0 1 1 3.72 1.9c-.92.67-1.52 1.12-1.52 2.1"/><path d="M12 17h.01"/></svg></button>
      </div>
    </div>
  </header>
  <main class="main">
    <section class="page-intro" aria-labelledby="heroTitle">
      <div><h2 id="heroTitle" data-i18n="introTitle">図やノートをめくる教材に</h2><p data-i18n="lead">答えが書かれた画像を、そのまま教材に。まずは画像を追加してください。</p></div>
      <div class="local-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 5 6v5c0 4.6 2.8 8 7 10 4.2-2 7-5.4 7-10V6z"/><path d="m9 12 2 2 4-5"/></svg><span data-i18n="localBadge">完全ローカル処理</span></div>
    </section>
    <!-- APP:BEGIN Reveal Sheet foundation -->
    <nav class="reveal-nav" aria-label="Workflow" data-i18n-aria-label="workflow">
      <button id="createButton" type="button" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h5M8 16h8"/></svg><span data-i18n="create"></span></button>
      <button id="studyButton" type="button" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m9 5 11 7-11 7z"/></svg><span data-i18n="study"></span></button>
      <button id="saveButton" type="button" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 15v6h16v-6"/></svg><span data-i18n="save"></span></button>
    </nav>
    <section class="shell reveal-shell" aria-label="Create a sheet" data-i18n-aria-label="create">
      <div class="reveal-tools" id="editControls">
        <button class="button primary" id="addButton" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m4 17 5-5 4 4 3-3 5 5M15 8h3m-1.5-1.5v3"/></svg><span data-i18n="addImages"></span></button>
        <button class="button" id="openButton" type="button"><span data-i18n="openSheet"></span></button>
        <input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" multiple hidden><input id="sheetInput" type="file" accept=".reveal.json,.reveal.html,application/json,text/html" hidden>
        <label class="cover-color-control" for="coverColor"><span data-i18n="coverColor"></span><input id="coverColor" type="color" value="#16624f" data-i18n-aria-label="coverColor"></label>
        <div class="secondary-tools">
          <button class="button" id="undoButton" type="button" disabled data-i18n-aria-label="undo" data-i18n-title="undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m9 5-5 5 5 5M5 10h9a5 5 0 0 1 0 10"/></svg></button>
          <button class="button" id="redoButton" type="button" disabled data-i18n-aria-label="redo" data-i18n-title="redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m15 5 5 5-5 5M19 10h-9a5 5 0 0 0 0 10"/></svg></button>
          <button class="button" id="newButton" type="button" disabled data-i18n="newSheet"></button><button class="button" id="returnToStudyButton" type="button" hidden data-i18n="returnToStudy"></button>
        </div>
      </div>
      <section id="studyPanel" class="study-panel" hidden aria-label="Study" data-i18n-aria-label="studyPanelLabel">
        <div class="study-mode-switch" role="group" data-i18n-aria-label="studyModeLabel"><button class="button" id="freeModeButton" type="button" aria-pressed="true" data-i18n="freeStudy"></button><button class="button" id="guidedModeButton" type="button" aria-pressed="false" data-i18n="oneAtATime"></button></div>
        <p id="studyPageDescription" class="study-page-description" hidden></p>
        <div id="freeStudyPanel"><div class="study-summary"><div><h3 id="freeStudyTitle" data-i18n="freeStudy"></h3><p><span data-i18n="confirmedLabel"></span> <strong id="confirmedCount">0</strong> / <strong id="studyQuestionCount">0</strong></p></div><div class="study-actions"><button class="button" id="hideAllButton" type="button" data-i18n="hideAll"></button><button class="button" id="revealPageButton" type="button" data-i18n="revealPage"></button></div></div><div id="questionList" class="question-list" aria-label="Questions" data-i18n-aria-label="questionsLabel"></div><div id="freeAnswerBox" class="guided-answer free-answer-box" role="region" aria-live="polite" aria-atomic="true" hidden><strong data-i18n="revealedAnswerTextLabel"></strong><p id="freeAnswerText"></p></div></div>
        <div id="guidedPanel" hidden><div class="guided-card"><div class="guided-head"><span data-i18n="guidedProgressLabel"></span> <strong id="guidedProgress" role="status" aria-live="polite">0 / 0</strong></div><p id="guidedPrompt" class="guided-text" hidden></p><div id="guidedAnswerBox" class="guided-answer" role="region" aria-live="polite" aria-atomic="true" hidden><strong data-i18n="guidedAnswerLabel"></strong><p id="guidedAnswer"></p></div><div class="guided-primary-actions"><button class="button primary" id="revealCurrentButton" type="button" data-i18n="revealCurrent"></button><div class="guided-rating-actions"><button class="button" id="recalledButton" type="button" disabled data-i18n="recalled"></button><button class="button" id="againButton" type="button" disabled data-i18n="reviewAgain"></button></div></div><div class="guided-secondary-actions"><button class="button" id="previousQuestionButton" type="button" data-i18n="previousQuestion"></button><button class="button" id="skipButton" type="button" data-i18n="skip"></button><button class="button" id="editCurrentQuestionButton" type="button" data-i18n="editCurrentQuestion"></button><button class="button" id="finishStudyButton" type="button" data-i18n="finishStudy"></button></div></div><div class="guided-tools-row"><details id="guidedSettings" class="guided-disclosure"><summary data-i18n="guidedDisplaySettings"></summary><fieldset class="guided-options"><legend data-i18n="otherAnswersLabel"></legend><label><input id="otherAnswersHidden" type="radio" name="otherAnswers" value="hidden" checked><span data-i18n="otherAnswersHidden"></span></label><label><input id="otherAnswersVisible" type="radio" name="otherAnswers" value="visible"><span data-i18n="otherAnswersVisible"></span></label></fieldset></details><details id="guidedQuestionNavigator" class="guided-disclosure"><summary data-i18n="guidedQuestionNav"></summary><div id="guidedQuestionList" class="question-list" aria-label="Guided questions" data-i18n-aria-label="guidedQuestionsLabel"></div></details></div><section id="studyResults" class="study-results" hidden><h3 data-i18n="studyResultsTitle"></h3><div class="result-grid"><span data-i18n="resultTotalLabel"></span><strong id="resultTotal">0</strong><span data-i18n="resultRecalledLabel"></span><strong id="resultRecalled">0</strong><span data-i18n="resultAgainLabel"></span><strong id="resultAgain">0</strong><span data-i18n="resultSkippedLabel"></span><strong id="resultSkipped">0</strong><span data-i18n="resultUnansweredLabel"></span><strong id="resultUnanswered">0</strong></div><p id="previousResultSummary" class="previous-result" hidden></p><div class="study-actions"><button class="button" id="reviewAgainButton" type="button" hidden data-i18n="reviewAgainOnly"></button><button class="button" id="reviewUncheckedButton" type="button" hidden data-i18n="reviewUnchecked"></button></div></section></div>
      </section>
      <section id="savePanel" class="save-panel" hidden aria-labelledby="savePanelTitle">
        <h3 id="savePanelTitle" data-i18n="savePanelTitle"></h3>
        <div class="save-summary">
          <span><span data-i18n="savePages"></span> <strong id="savePageCount">0</strong></span>
          <span><span data-i18n="saveQuestions"></span> <strong id="saveQuestionCount">0</strong></span>
          <span><span data-i18n="saveAuxiliary"></span> <strong id="saveAuxCount">0</strong></span>
          <span><span data-i18n="saveImageSize"></span> <strong id="saveImageBytes">0 B</strong></span>
          <span><span data-i18n="saveEditableSize"></span> <strong id="saveJsonBytes">—</strong></span>
          <span><span data-i18n="saveLessonSize"></span> <strong id="saveHtmlBytes">—</strong></span>
        </div>
        <p class="save-note" data-i18n="saveIncludesImages"></p>
        <label class="export-field" for="outputFilename"><span class="export-label" data-i18n="outputFilename"></span><span class="filename-control"><input class="filename-input" id="outputFilename" type="text" value="reveal-sheet" autocomplete="off" spellcheck="false"></span></label>
        <div class="save-output-actions"><span><button class="button primary" id="downloadJsonButton" type="button" data-i18n="saveEditable"></button><small>.reveal.json</small></span><span><button class="button" id="downloadHtmlButton" type="button" disabled data-i18n="saveLesson"></button><small>.reveal.html</small></span><span><button class="button" id="previewLessonButton" type="button" disabled data-i18n="previewLesson"></button></span></div>
      </section>
      <p class="input-note" data-i18n="inputHint"></p>
      <div class="input-status-row"><p id="inputStatus" role="status" aria-live="polite"></p><button class="button" id="cancelButton" type="button" hidden data-i18n="stop"></button></div>
      <div id="loadedSection" hidden class="sheet-header"><h2 id="sheetTitle"></h2><span id="sheetCount"></span></div>
      <div class="reveal-grid">
        <aside class="page-panel"><h3 data-i18n="pages"></h3><div id="pageList" class="page-list" aria-label="Pages" data-i18n-aria-label="pages"></div></aside>
        <div class="preview-column">
          <div class="preview-surface" id="dropZone">
            <div class="empty-preview" id="emptyPreview"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="12" y="8" width="40" height="48" rx="5"/><path d="M21 20h22M21 30h22M21 40h12"/><rect x="30" y="26" width="17" height="8" rx="2" fill="currentColor"/></svg><h2 data-i18n="emptyTitle"></h2><p data-i18n="emptyBody"></p></div>
            <p class="preview-wait" id="previewWait" hidden></p>

          error_UNSUPPORTED_IMAGE:'Unsupported format or mismatched file type. Choose a JPEG, static PNG or static WebP image.',error_ANIMATED_IMAGE:'Animated images are not supported. Choose a still image.',error_IMAGE_TOO_LARGE:'The image exceeds a limit: input 20 MiB, 8192 px per side, 16 million pixels, or 32 MiB after PNG conversion. Choose a smaller image.',error_DECODE_FAILED:'The image could not be decoded. It may be damaged. Choose another image.',error_LIMIT_EXCEEDED:'The sheet or file exceeds a safety limit. Reduce its contents and try again.',error_INVALID_SHEET:'Could not open this file. Choose valid Reveal Sheet editable data or lesson HTML.',error_UNSUPPORTED_SCHEMA:'This sheet was created with a newer save format. Open it with a newer Reveal Sheet version.',error_EXPORT_FAILED:'Could not prepare the file to save. Your sheet is still open. Try saving again.'
        }
      };
      const $ = selector => document.querySelector(selector);
      let language = (APP_CONFIG.defaultLanguage === 'ja' || APP_CONFIG.defaultLanguage === 'en') ? APP_CONFIG.defaultLanguage : ((navigator.language || '').toLowerCase().startsWith('ja') ? 'ja' : 'en');
      function translate(key, values = {}) {
        const text = translations[language]?.[key] ?? translations.en[key] ?? key;
        return text.replace(/\{([a-zA-Z]+)\}/g, (match, name) => Object.hasOwn(values, name) ? String(values[name]) : match);
      }
      // Reusable Promise-based confirmation API. Canonical source: components/confirm-dialog.html.
      const AppConfirm = (() => {
        const dialog=$('#appConfirmDialog'),title=$('#appConfirmTitle'),message=$('#appConfirmMessage');
        const closeButton=$('#appConfirmClose'),cancelButton=$('#appConfirmCancel'),okButton=$('#appConfirmOk');
        let resolver=null,restoreFocus=null;
        function finish(result) {
          if(!dialog.open)return;
          const currentResolver=resolver;resolver=null;dialog.close();
          if(restoreFocus instanceof HTMLElement && restoreFocus.isConnected)restoreFocus.focus({preventScroll:true});
          restoreFocus=null;if(currentResolver)currentResolver(result);
        }
        function ask({title:heading,message:body,confirmLabel,cancelLabel,tone='default'}={}) {
          if(dialog.open)finish(false);
          title.textContent=heading||translate('confirmTitle');message.textContent=body||'';
          cancelButton.textContent=cancelLabel||translate('cancel');okButton.textContent=confirmLabel||translate('confirmAction');
          okButton.classList.toggle('danger',tone==='danger');okButton.classList.toggle('primary',tone!=='danger');restoreFocus=document.activeElement;
          return new Promise(resolve=>{resolver=resolve;dialog.showModal();requestAnimationFrame(()=>cancelButton.focus({preventScroll:true}));});
        }
        closeButton.addEventListener('click',()=>finish(false));cancelButton.addEventListener('click',()=>finish(false));okButton.addEventListener('click',()=>finish(true));
        dialog.addEventListener('cancel',event=>{event.preventDefault();finish(false);});
        dialog.addEventListener('click',event=>{const rect=dialog.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)finish(false);});
        return Object.freeze({ask});
      })();
      window.AppConfirm=AppConfirm;
      // Reusable toast / Undo API. Canonical source: components/toast.html.
      const AppToast = (() => {
        const root=$('#appToast'),message=$('#appToastMessage'),action=$('#appToastAction');let timer=0,actionHandler=null;
        function dismiss(){clearTimeout(timer);timer=0;root.classList.remove('show');actionHandler=null;}
        function show({message:text='',actionLabel='',onAction=null,duration=3200,tone='default'}={}){
          clearTimeout(timer);message.textContent=String(text);root.dataset.tone=tone;actionHandler=typeof onAction==='function'?onAction:null;action.textContent=actionLabel||'';action.hidden=!actionHandler||!actionLabel;root.classList.add('show');if(duration>0)timer=window.setTimeout(dismiss,duration);return Object.freeze({dismiss});
        }
        action.addEventListener('click',()=>{const handler=actionHandler;dismiss();if(handler)handler();});return Object.freeze({show,dismiss});
      })();
      window.AppToast=AppToast;
      /* REVEAL:APP_JS */
      const REVEAL_PLAYER_TEMPLATE = __REVEAL_PLAYER_TEMPLATE_JSON__;
      const core=createRevealCore();
      const imageIO=createImageIO({core,env:window});
      const projectIO=createProjectIO({core,imageIO,env:window});
      const persistence=createPersistence({core,env:window});
      let revealEditor=null;
      function applyLanguage(){
        document.documentElement.lang=language;
        document.querySelectorAll('[data-i18n]').forEach(node=>{node.textContent=translate(node.dataset.i18n);});
        document.querySelectorAll('[data-i18n-title]').forEach(node=>{node.title=translate(node.dataset.i18nTitle);});
        document.querySelectorAll('[data-i18n-aria-label]').forEach(node=>{node.setAttribute('aria-label',translate(node.dataset.i18nAriaLabel));});
        $('#languageButton').textContent=language==='ja'?'EN':'日本語';$('#languageButton').setAttribute('aria-label',language==='ja'?'英語に切り替え':'Switch to Japanese');
        document.title=language==='ja'?APP_CONFIG.nameJa+' | Reveal Sheet':APP_CONFIG.name;
        $('#brandName').textContent=language==='ja'?APP_CONFIG.nameJa:APP_CONFIG.name;$('#footerName').textContent=APP_CONFIG.name;revealEditor?.localize();
      }
      applyLanguage();
      revealEditor=createEditor({core,imageIO,projectIO,persistence,playerTemplate:REVEAL_PLAYER_TEMPLATE,appVersion:APP_CONFIG.version,env:window,translate,getLanguage:()=>language});
      $('#versionBadge').textContent=`v${APP_CONFIG.version}`;
      $('#languageButton').addEventListener('click',()=>{language=language==='ja'?'en':'ja';applyLanguage();});
      const helpDialog=$('#helpDialog');$('#helpButton').addEventListener('click',()=>helpDialog.showModal());$('#closeHelpButton').addEventListener('click',()=>helpDialog.close());
      helpDialog.addEventListener('click',event=>{const rect=helpDialog.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)helpDialog.close();});
    })();
  </script>
