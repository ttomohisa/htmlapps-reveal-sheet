name: Refresh release screenshots

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/capture-qa.mjs
      - .github/workflows/refresh-release-screenshots.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-release-screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked development packages
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build and verify standalone HTML
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Install development Chromium
        run: npx playwright install chromium

      - name: Capture current rendered UI
        shell: pwsh
        env:
          CAPTURE_UPDATE_ASSETS: "1"
        run: node scripts/capture-qa.mjs

      - name: Verify screenshot files
        shell: pwsh
        run: |
          $required = @(
            'assets/screenshot.png',
            'assets/screenshot-en.png',
            'assets/screenshot-mobile.png',
            'assets/screenshot-mobile-edit.png'
          )
          foreach ($path in $required) {
            if (!(Test-Path $path)) { throw "Missing release screenshot: $path" }
            $bytes = (Get-Item $path).Length
            if ($bytes -lt 10000) { throw "Release screenshot looks unexpectedly small: $path ($bytes bytes)" }
          }

      - name: Commit refreshed screenshots
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshot.png assets/screenshot-en.png assets/screenshot-mobile.png assets/screenshot-mobile-edit.png
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release screenshots already match the current capture."
            exit 0
          }
          if ($LASTEXITCODE -ne 1) { throw "Could not inspect staged screenshots." }
          git commit -m "docs: refresh Reveal Sheet release screenshots"
          if ("${{ github.event_name }}" -eq "pull_request") {
            $target = "${{ github.event.pull_request.head.ref }}"
          } else {
            $target = "${{ github.ref_name }}"
          }
          git fetch origin $target
          if ($LASTEXITCODE -ne 0) { throw "Could not refresh screenshot target branch." }
          # Repository validation can leave generated script changes in the worktree.
          # Keep the screenshot commit isolated while Git rebases onto newer PR commits.
          git -c rebase.autoStash=true rebase "origin/$target"
          if ($LASTEXITCODE -ne 0) { throw "Screenshot update conflicted with newer branch changes." }
          git push origin "HEAD:$target"
          if ($LASTEXITCODE -ne 0) { throw "Screenshot push failed." }
