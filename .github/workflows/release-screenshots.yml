name: Refresh v1 release screenshots

on:
  push:
    branches:
      - release/v1.0.0-candidate
    paths:
      - ".github/workflows/release-screenshots.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install locked development packages
        run: npm ci

      - name: Build canonical standalone app
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Capture actual app UI
        run: node scripts/capture-qa.mjs

      - name: Commit release screenshots
        shell: pwsh
        run: |
          Copy-Item test-results/capture/screenshot.png assets/screenshot.png -Force
          Copy-Item test-results/capture/screenshot-en.png assets/screenshot-en.png -Force
          Copy-Item test-results/capture/screenshot-mobile.png assets/screenshot-mobile.png -Force

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshot.png assets/screenshot-en.png assets/screenshot-mobile.png

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Screenshots are already current."
            exit 0
          }

          git commit -m "docs: refresh v1.0.0 release screenshots"
          git push origin "HEAD:$env:GITHUB_REF_NAME"
