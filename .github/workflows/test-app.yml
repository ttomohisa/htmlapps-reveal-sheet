name: Reveal Sheet application tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked development packages
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Windows PowerShell syntax and assembly failures
        shell: powershell
        run: |
          .\scripts\check-powershell-syntax.ps1
          .\scripts\test-reveal-build.ps1
      - name: Build and verify canonical artifacts
        shell: pwsh
        run: |
          ./scripts/check-repository.ps1
          ./scripts/test-reveal-build.ps1
      - name: Unit tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          npm run test:unit 2>&1 | Tee-Object test-results/unit.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install development Chromium
        run: npx playwright install chromium
      - name: Readable HTML direct-file tests
        shell: pwsh
        run: |
          npm run test:e2e -- --project=chromium 2>&1 | Tee-Object test-results/readable.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Self-extracting HTML direct-file tests
        shell: pwsh
        env:
          APP_VARIANT: self-extract
        run: |
          npm run test:e2e -- --project=chromium 2>&1 | Tee-Object test-results/self-extract.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Capture rendered UI and environment
        run: node scripts/capture-qa.mjs

      - name: Freeze v1 release screenshots on the candidate branch
        if: github.event_name == 'pull_request' && github.head_ref == 'release/v1.0.0-candidate'
        shell: pwsh
        run: |
          Copy-Item test-results/capture/screenshot.png assets/screenshot.png -Force
          Copy-Item test-results/capture/screenshot-en.png assets/screenshot-en.png -Force
          Copy-Item test-results/capture/screenshot-mobile.png assets/screenshot-mobile.png -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshot.png assets/screenshot-en.png assets/screenshot-mobile.png
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release screenshots are already current."
            exit 0
          }
          git commit -m "docs: refresh v1.0.0 release screenshots"
          git push origin "HEAD:$env:GITHUB_HEAD_REF"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reveal-qa-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/
            dist/
            reveal-sheet.html
            docs/QA_MATRIX.md
            docs/QA_RESULTS.md
          retention-days: 14
          if-no-files-found: error
